    <style>
        /* High-End Editorial & Regal Calligraphy Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&family=Pinyon+Script&display=swap');
        @import url('https://fonts.cdnfonts.com/css/chalisa-oktavia');

        /* Optional Local Fallback if you upload the font file to your GitHub repo */
        @font-face {
            font-family: 'Chalisa Oktavia';
            src: local('Chalisa Oktavia'), local('ChalisaOktavia'),
                 url('ChalisaOktavia.ttf') format('truetype'),
                 url('Chalisa Oktavia.ttf') format('truetype'),
                 url('ChalisaOktavia.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        :root {
            --kasavu-gold: #D4AF37;
            --soft-gold: #E5C158;
            --champagne-gold: #F7E7CE;
            --pure-white: #FFFFFF;
            --off-white: #FDFBF7;
            --obsidian: #050806;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--obsidian);
            color: var(--off-white);
            overflow: hidden; 
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        /* 
         * 1. LUXURY ENVELOPE ENTRY SCREEN
         */
        .envelope-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            background: radial-gradient(circle at center, #111914 0%, #050806 100%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
            overflow: hidden;
        }

        .envelope-overlay.opened {
            opacity: 0;
            transform: scale(1.06);
            pointer-events: none;
            visibility: hidden;
        }

        /* Subtle outer gold frame on envelope screen */
        .envelope-border {
            position: absolute;
            top: 18px; left: 18px; right: 18px; bottom: 18px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 1;
        }

        .envelope-border::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 0.5px solid rgba(212, 175, 55, 0.15);
        }

        /* Top Envelope Flap */
        .envelope-flap-top {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 56%;
            background: linear-gradient(180deg, #131b16 0%, #0a100c 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        /* Gold trim along the V-edge of the top flap */
        .envelope-flap-edge {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 56.3%;
            background: linear-gradient(90deg, rgba(212,175,55,0.15), rgba(247,231,206,0.7), rgba(212,175,55,0.15));
            clip-path: polygon(0 0, 100% 0, 50% 100%, 49.6% 99.4%, 0 0.5%);
            transform-origin: top center;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            pointer-events: none;
        }

        /* Bottom Pocket Lines */
        .envelope-pocket-bottom {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 55%;
            background: linear-gradient(0deg, #060907 0%, #0c120e 100%);
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 1;
            pointer-events: none;
        }

        .envelope-overlay.opening .envelope-flap-top,
        .envelope-overlay.opening .envelope-flap-edge {
            transform: rotateX(180deg);
        }

        /* Envelope Center Typography Plaque */
        .envelope-content {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 25px 20px;
            width: 90%;
            max-width: 440px;
            transition: transform 0.7s ease, opacity 0.7s ease;
        }

        .envelope-overlay.opening .envelope-content {
            transform: translateY(-20px);
            opacity: 0;
        }

        .env-pretitle {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.55rem, 2.2vw, 0.7rem);
            letter-spacing: 5px;
            color: rgba(247, 231, 206, 0.8);
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* CHALISA OKTAVIA with Shimmering Metallic Gold Foil Text Effect */
        .gold-foil-names {
            font-family: 'Chalisa Oktavia', 'Pinyon Script', cursive;
            font-size: clamp(2.6rem, 10.5vw, 4rem);
            line-height: 1.25;
            margin: 0;
            background: linear-gradient(135deg, #C59B27 0%, #FCF6BA 30%, #D4AF37 50%, #FBF5B7 70%, #AA771C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.85));
            font-weight: 400;
            padding: 10px 12px;
            display: block;
        }

        .env-ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.3rem, 4.5vw, 1.7rem);
            color: var(--kasavu-gold);
            margin: 2px 0;
            letter-spacing: 2px;
        }

        /* 3D Luxury Gold Wax Seal */
        .wax-seal-wrapper {
            margin: 28px auto 14px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wax-seal {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #F5D77F 0%, #D4AF37 45%, #8A640F 85%, #5A3E04 100%);
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.9),
                inset 0 2px 5px rgba(255,255,255,0.6),
                inset 0 -4px 8px rgba(0,0,0,0.6),
                0 0 20px rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: sealPulse 2.5s infinite ease-in-out;
            border: 1.5px solid rgba(252, 246, 186, 0.5);
        }

        .wax-seal::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border-radius: 50%;
            border: 1px dashed rgba(90, 62, 4, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .seal-monogram {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #4A3200;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .tap-prompt {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 4px;
            color: var(--champagne-gold);
            text-transform: uppercase;
            margin-top: 16px;
            opacity: 0.85;
            animation: fadeBlink 2s infinite alternate;
        }

        @keyframes sealPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(0,0,0,0.9), 0 0 15px rgba(212, 175, 55, 0.25); }
            50% { transform: scale(1.05); box-shadow: 0 14px 30px rgba(0,0,0,0.95), 0 0 28px rgba(212, 175, 55, 0.55); }
        }

        @keyframes fadeBlink {
            0% { opacity: 0.45; }
            100% { opacity: 1; }
        }

        /* 
         * 2. AMBIENT GOLD DUST CANVAS
         */
        #gold-dust-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 3;
        }

        /* 
         * 3. AESTHETIC FULL-SCREEN VERTICAL REEL
         */
        .reel-container {
            height: 100vh;
            height: 100dvh; 
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            position: relative;
            -webkit-overflow-scrolling: touch; 
        }

        .slide {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 
         * FULL RESOLUTION BACKGROUND STACK
         */
        .slide-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            image-rendering: -webkit-optimize-contrast;
            z-index: 0;
        }

        .bg-slide-1 { background-image: url('3ae5e1fd0759a9d37f9ea03ef4c1c755.jpg'); }
        .bg-slide-2 { background-image: url('b3219ac4a5758c971474439a28830d00.jpg'); }
        .bg-slide-3 { background-image: url('7f00c9acee3ca2a463cbbe19b6335510.jpg'); }
        .bg-slide-4 { background-image: url('623db16133a6758f32539fd6d8303f46.jpg'); }

        /* 
         * HORIZONTAL CAROUSEL FOR COUPLE PHOTOS
         */
        .horizontal-carousel {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            z-index: 1;
            scrollbar-width: none;
        }
        
        .horizontal-carousel::-webkit-scrollbar {
            display: none;
        }

        .carousel-item {
            min-width: 100vw;
            height: 100%;
            scroll-snap-align: center;
            position: relative;
            overflow: hidden;
        }

        .carousel-bg {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.3);
            z-index: 0;
        }

        .carousel-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain; 
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
        }

        /* 
         * EDITORIAL DARKENING OVERLAY
         */
        .slide-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5,10,7,0.35) 0%, rgba(5,10,7,0.95) 100%);
            z-index: 2;
        }

        /* 
         * TRANSPARENT EDITORIAL LAYOUT
         */
        .editorial-wrapper {
            background: transparent;
            padding: 20px;
            width: 90%;
            max-width: 460px;
            position: relative;
            z-index: 4;
            text-align: center;
        }

        /* 
         * VISUAL GRACE: CASCADING BLUR-REVEAL ANIMATIONS
         */
        .animate-item {
            opacity: 0;
            transform: translateY(25px);
            filter: blur(8px);
            transition: opacity 1.2s ease-out, transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 1.2s ease-out;
        }

        .editorial-wrapper.visible .animate-item {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .editorial-wrapper.visible .animate-item:nth-child(1) { transition-delay: 0.1s; }
        .editorial-wrapper.visible .animate-item:nth-child(2) { transition-delay: 0.2s; }
        .editorial-wrapper.visible .animate-item:nth-child(3) { transition-delay: 0.3s; }
        .editorial-wrapper.visible .animate-item:nth-child(4) { transition-delay: 0.4s; }
        .editorial-wrapper.visible .animate-item:nth-child(5) { transition-delay: 0.5s; }
        .editorial-wrapper.visible .animate-item:nth-child(6) { transition-delay: 0.6s; }
        .editorial-wrapper.visible .animate-item:nth-child(7) { transition-delay: 0.7s; }
        .editorial-wrapper.visible .animate-item:nth-child(8) { transition-delay: 0.8s; }
        .editorial-wrapper.visible .animate-item:nth-child(9) { transition-delay: 0.9s; }
        .editorial-wrapper.visible .animate-item:nth-child(10) { transition-delay: 1.0s; }
        .editorial-wrapper.visible .animate-item:nth-child(11) { transition-delay: 1.1s; }
        .editorial-wrapper.visible .animate-item:nth-child(12) { transition-delay: 1.2s; }

        .christian-cross {
            width: 1.5px;
            height: 42px;
            background: var(--kasavu-gold);
            margin: 0 auto 20px auto;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .christian-cross::after {

            position: absolute;

            width: 23px;

            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .vertical-line {
            width: 1.5px;
            height: 45px;
            background: linear-gradient(to bottom, transparent, var(--kasavu-gold), transparent);
            margin: 0 auto 16px auto;
        }
        
        .horizontal-line {
            width: 60px;
            height: 1.5px;
            background: var(--kasavu-gold);
            margin: 20px auto;
            opacity: 0.7;
        }

        /* 
         * REFINED TYPOGRAPHY
         */
        .names-script {
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(2.9rem, 11.5vw, 4.4rem); 
            color: var(--pure-white);
            line-height: 1.05;
            margin: 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 2px 5px rgba(0,0,0,0.8);
            font-weight: 400;
        }

        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            color: var(--kasavu-gold);
            font-style: italic;
            margin: 6px 0;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .details {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            letter-spacing: 3px;
            color: rgba(253, 251, 247, 0.95);
            text-transform: uppercase;
            font-weight: 400;
            line-height: 1.8;

        .theme-note {

        .event-heading {

        .date-highlight {

        .time-highlight {

            letter-spacing: 2.5px;
            color: rgba(253, 251, 247, 0.9);
            text-transform: uppercase;

        .venue-bold {

        }

        /* 
         * INTERACTIVE ACTION PILL BUTTONS (MAP & CALENDAR)
         */
        .action-btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            margin: 12px 0 10px 0;
        }

        .map-icon {

        /* 
         * LIVE EDITORIAL COUNTDOWN TIMER
         */
        .countdown-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 18px auto;

        }

        .swipe-indicator {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            z-index: 10;
            animation: swipePulse 2s infinite;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            pointer-events: none; 
        }

        .swipe-indicator::after {
            content: '';
            display: block;
            width: 1px;
            height: 18px;
            background: rgba(255,255,255,0.6);
            margin: 6px auto 0 auto;
        }

        @keyframes swipePulse {
            0% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-5px); }
            100% { opacity: 0.4; transform: translateX(-50%) translate
