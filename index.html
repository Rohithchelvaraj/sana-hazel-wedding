<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana & Hazel - Kerala Christian Wedding</title>
    <style>
        /* High-End Editorial Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap');
        
        :root {
            --kasavu-gold: #D4AF37;
            --soft-gold: #E5C158;
            --pure-white: #FFFFFF;
            --off-white: #FDFBF7;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #050806;
            color: var(--off-white);
            overflow: hidden; 
            scroll-behavior: smooth;
        }

        /* 
         * AESTHETIC FULL-SCREEN VERTICAL REEL
         */
        .reel-container {
            height: 100vh;
            height: 100dvh; 
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            position: relative;
            -webkit-overflow-scrolling: touch; 
        }

        .slide {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 
         * FULL RESOLUTION BACKGROUND STACK
         */
        .slide-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            image-rendering: -webkit-optimize-contrast;
            z-index: 0;
        }

        .bg-slide-1 { background-image: url('3ae5e1fd0759a9d37f9ea03ef4c1c755.jpg'); }
        .bg-slide-2 { background-image: url('b3219ac4a5758c971474439a28830d00.jpg'); }
        .bg-slide-3 { background-image: url('7f00c9acee3ca2a463cbbe19b6335510.jpg'); }
        .bg-slide-4 { background-image: url('623db16133a6758f32539fd6d8303f46.jpg'); }

        /* 
         * HORIZONTAL CAROUSEL FOR COUPLE PHOTOS (7 PHOTOS)
         */
        .horizontal-carousel {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            z-index: 1;
            scrollbar-width: none;
        }
        
        .horizontal-carousel::-webkit-scrollbar {
            display: none;
        }

        .carousel-item {
            min-width: 100vw;
            height: 100%;
            scroll-snap-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Blurred background fill for uncropped photos */
        .carousel-bg {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.3);
            z-index: 0;
        }

        /* Uncropped, fully visible foreground photo */
        .carousel-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
        }

        /* 
         * EDITORIAL DARKENING OVERLAY
         */
        .slide-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5,10,7,0.35) 0%, rgba(5,10,7,0.95) 100%);
            z-index: 2;
        }

        /* 
         * TRANSPARENT EDITORIAL LAYOUT
         */
        .editorial-wrapper {
            background: transparent;
            padding: 20px;
            width: 90%;
            max-width: 450px;
            position: relative;
            z-index: 4;
            text-align: center;
        }

        /* 
         * VISUAL GRACE: CASCADING BLUR-REVEAL ANIMATIONS
         */
        .animate-item {
            opacity: 0;
            transform: translateY(25px);
            filter: blur(8px);
            transition: opacity 1.2s ease-out, transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 1.2s ease-out;
        }

        .editorial-wrapper.visible .animate-item {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .editorial-wrapper.visible .animate-item:nth-child(1) { transition-delay: 0.1s; }
        .editorial-wrapper.visible .animate-item:nth-child(2) { transition-delay: 0.25s; }
        .editorial-wrapper.visible .animate-item:nth-child(3) { transition-delay: 0.4s; }
        .editorial-wrapper.visible .animate-item:nth-child(4) { transition-delay: 0.55s; }
        .editorial-wrapper.visible .animate-item:nth-child(5) { transition-delay: 0.7s; }
        .editorial-wrapper.visible .animate-item:nth-child(6) { transition-delay: 0.85s; }
        .editorial-wrapper.visible .animate-item:nth-child(7) { transition-delay: 1.0s; }
        .editorial-wrapper.visible .animate-item:nth-child(8) { transition-delay: 1.15s; }
        .editorial-wrapper.visible .animate-item:nth-child(9) { transition-delay: 1.30s; }
        .editorial-wrapper.visible .animate-item:nth-child(10) { transition-delay: 1.45s; }

        /* Christian Wedding Gold Cross */
        .christian-cross {
            width: 1.5px;
            height: 45px;
            background: var(--kasavu-gold);
            margin: 0 auto 25px auto;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .christian-cross::after {
            content: '';
            position: absolute;
            top: 15px;
            left: -12px;
            width: 25px;
            height: 1.5px;
            background: var(--kasavu-gold);
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .vertical-line {
            width: 1.5px;
            height: 50px;
            background: linear-gradient(to bottom, transparent, var(--kasavu-gold), transparent);
            margin: 0 auto 20px auto;
        }
        
        .horizontal-line {
            width: 60px;
            height: 1.5px;
            background: var(--kasavu-gold);
            margin: 25px auto;
            opacity: 0.7;
        }

        /* 
         * TYPOGRAPHY WITH CINEMATIC SHADOWS
         */
        .names-script {
            font-family: 'Great Vibes', cursive;
            /* Scaled slightly to accommodate 'Hazel Joshy Thomas' gracefully on mobile */
            font-size: clamp(2.7rem, 11vw, 4.3rem);
            color: var(--pure-white);
            line-height: 1.05;
            margin: 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 2px 5px rgba(0,0,0,0.8);
            font-weight: 400;
        }

        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            color: var(--kasavu-gold);
            font-style: italic;
            margin: 6px 0;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .details {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            letter-spacing: 3px;
            color: rgba(253, 251, 247, 0.95);
            text-transform: uppercase;
            font-weight: 400;
            line-height: 1.9;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .theme-note {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
            text-transform: none;
            margin-top: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .event-heading {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.6rem, 6vw, 2.2rem);
            color: var(--kasavu-gold);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
            text-shadow: 0 3px 15px rgba(0,0,0,0.9);
        }

        .date-highlight {
            color: var(--pure-white); 
            font-weight: 500;
            font-size: clamp(1.1rem, 4.5vw, 1.4rem);
            display: block;
            margin: 12px 0 6px 0;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }

        .time-highlight {
            font-size: clamp(0.75rem, 3vw, 0.9rem);
            letter-spacing: 2.5px;
            color: rgba(253, 251, 247, 0.9);
            text-transform: uppercase;
            display: block;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .venue-bold {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--kasavu-gold);
            font-size: clamp(0.95rem, 3.5vw, 1.15rem);
            display: block;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* 
         * INTERACTIVE ELEMENTS (MAP & RSVP BUTTONS)
         */
        .map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 8px 0 15px 0;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            color: var(--pure-white);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        .map-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--kasavu-gold);
            transform: translateY(-2px);
        }

        .map-icon {
            width: 14px;
            height: 14px;
            fill: var(--kasavu-gold);
        }

        .swipe-indicator {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            z-index: 10;
            animation: swipePulse 2s infinite;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            pointer-events: none; 
        }

        .swipe-indicator::after {
            content: '';
            display: block;
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.6);
            margin: 8px auto 0 auto;
        }

        @keyframes swipePulse {
            0% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-5px); }
            100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
        }

        .rsvp-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 42px;
            background: rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid var(--kasavu-gold);
            color: var(--kasavu-gold);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            font-family: 'Cinzel', serif;
            transition: all 0.5s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        
        .rsvp-btn:hover {
            background: var(--kasavu-gold);
            color: #000;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* 
         * ENHANCED AESTHETIC MUSIC PLAYER CAPSULE
         */
        .music-control {
            position: fixed;
            top: 22px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(8, 12, 10, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6), inset 0 0 10px rgba(212, 175, 55, 0.08);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: musicGlow 3s infinite;
        }

        .music-control.playing {
            border-color: var(--kasavu-gold);
            background: rgba(12, 18, 14, 0.75);
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), 0 0 18px rgba(212, 175, 55, 0.3);
            animation: none;
        }

        @keyframes musicGlow {
            0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 0 0 rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 0 8px rgba(212, 175, 55, 0); }
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 13px;
        }

        .eq-bar {
            width: 2px;
            background-color: var(--kasavu-gold);
            border-radius: 2px;
            height: 3px;
            transition: height 0.3s ease;
        }

        /* Dancing equalizer bars when music is active */
        .music-control.playing .eq-bar:nth-child(1) { animation: eqBounce 0.8s ease-in-out infinite; }
        .music-control.playing .eq-bar:nth-child(2) { animation: eqBounce 0.6s ease-in-out infinite 0.2s; }
        .music-control.playing .eq-bar:nth-child(3) { animation: eqBounce 0.9s ease-in-out infinite 0.4s; }
        .music-control.playing .eq-bar:nth-child(4) { animation: eqBounce 0.7s ease-in-out infinite 0.1s; }

        @keyframes eqBounce {
            0%, 100% { height: 3px; }
            50% { height: 13px; }
        }

        .music-label {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 2.5px;
            color: var(--kasavu-gold);
            text-transform: uppercase;
        }

        #yt-player-container {
            position: absolute; 
            width: 0; 
            height: 0; 
            overflow: hidden; 
            opacity: 0; 
            pointer-events: none;
        }

        /* 
         * LUXURY RSVP MODAL OVERLAY
         */
        .rsvp-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 6, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .rsvp-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .rsvp-card {
            width: 85%;
            max-width: 360px;
            padding: 35px 25px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(10, 15, 12, 0.75);
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            text-align: center;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .rsvp-modal.open .rsvp-card {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.6rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            line-height: 1;
        }

        .rsvp-input {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            padding: 12px 5px;
            margin-bottom: 22px;
            color: var(--pure-white);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .rsvp-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .rsvp-input:focus {
            border-bottom-color: var(--kasavu-gold);
        }

        .rsvp-status {
            margin-top: 15px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--soft-gold);
            min-height: 1.4em;
        }
    </style>
</head>
<body>

    <!-- YOUTUBE PLAYER CONTAINER -->
    <div id="yt-player-container">
        <div id="ytplayer"></div>
    </div>

    <!-- ENHANCED AESTHETIC MUSIC BUTTON -->
    <div id="music-toggle" class="music-control">
        <div class="equalizer">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
        </div>
        <span class="music-label" id="music-label">Music</span>
    </div>

    <!-- RSVP MODAL OVERLAY -->
    <div id="rsvp-modal" class="rsvp-modal">
        <div class="rsvp-card">
            <span class="close-modal" id="close-rsvp">&times;</span>
            <h3 class="event-heading" style="font-size: 1.4rem; margin-top: 0;">RSVP</h3>
            <div class="horizontal-line" style="margin: 15px auto 25px auto; width: 40px;"></div>
            
            <form id="rsvp-form">
                <input type="text" name="Name" class="rsvp-input" placeholder="Your Full Name" required>
                <input type="tel" name="Phone" class="rsvp-input" placeholder="Phone Number" required>
                <button type="submit" class="rsvp-btn" id="submit-btn" style="width: 100%; margin-top: 10px;">Confirm Attendance</button>
            </form>
            <div id="rsvp-status" class="rsvp-status"></div>
        </div>
    </div>

    <div class="reel-container">
        
        <!-- SLIDE 1: WELCOME -->
        <section class="slide">
            <div class="slide-bg bg-slide-1"></div>
            <div class="slide-overlay"></div>
            
            <div class="editorial-wrapper" style="margin-bottom: 10vh;">
                <div class="christian-cross animate-item" style="margin-bottom: 20px;"></div>
                
                <div class="animate-item" style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(1.1rem, 4.5vw, 1.3rem); color: var(--kasavu-gold); margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.9);">
                    Two hearts, one love, and a lifetime ahead.
                </div>
                
                <div class="animate-item" style="font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: clamp(0.55rem, 2vw, 0.65rem); letter-spacing: 4px; color: var(--pure-white); text-transform: uppercase; margin-bottom: 22px; text-shadow: 0 2px 8px rgba(0,0,0,0.9);">
                    Together with their Families
                </div>
