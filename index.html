<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana & Hazel — Wedding Invitation</title>

    <!-- WhatsApp & iMessage Rich Link Preview -->
    <meta property="og:title" content="Sana Sunny & Hazel Joshy Thomas — Wedding Invitation">
    <meta property="og:description" content="Two hearts, one love, and a lifetime ahead. Join us in Wayanad on December 25 & 26, 2026.">
    <meta property="og:image" content="PhotoA.jpg">
    <meta property="og:type" content="website">

    <!-- Non-blocking Google Fonts & Chalisa Oktavia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/chalisa-oktavia" rel="stylesheet" media="print" onload="this.media='all'">

    <style>
        /* Optional Local Fallback if you upload the font file to your GitHub repo */
        @font-face {
            font-family: 'Chalisa Oktavia';
            src: local('Chalisa Oktavia'), local('ChalisaOktavia'),
                 url('ChalisaOktavia.ttf') format('truetype'),
                 url('Chalisa Oktavia.ttf') format('truetype'),
                 url('ChalisaOktavia.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        :root {
            --kasavu-gold: #D4AF37;
            --soft-gold: #E5C158;
            --champagne-gold: #F7E7CE;
            --pure-white: #FFFFFF;
            --off-white: #FDFBF7;
            --obsidian: #050806;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--obsidian);
            color: var(--off-white);
            overflow: hidden; 
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        /* 
         * 1. LUXURY ENVELOPE ENTRY SCREEN
         */
        .envelope-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #141f18 0%, #050806 100%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: opacity 0.9s ease, transform 0.9s ease, visibility 0.9s;
            overflow: hidden;
        }

        .envelope-overlay.opened {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
            visibility: hidden;
        }

        .envelope-border {
            position: absolute;
            top: 16px; left: 16px; right: 16px; bottom: 16px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            pointer-events: none;
            z-index: 4;
        }

        .envelope-border::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 0.5px solid rgba(212, 175, 55, 0.18);
        }

        /* Top Envelope Flap */
        .envelope-flap-top {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 55%;
            background: linear-gradient(180deg, #152019 0%, #0b110d 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 0.8s ease;
            z-index: 3;
            pointer-events: none;
        }

        /* Bottom Pocket */
        .envelope-pocket-bottom {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 55%;
            background: linear-gradient(0deg, #060907 0%, #0e1611 100%);
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
            -webkit-clip-path: polygon(0 100%, 100% 100%, 50% 0);
            z-index: 1;
            pointer-events: none;
        }

        .envelope-overlay.opening .envelope-flap-top {
            transform: scaleY(0);
        }

        /* Envelope Center Typography Plaque */
        .envelope-content {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 25px 20px;
            width: 90%;
            max-width: 440px;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        .envelope-overlay.opening .envelope-content {
            transform: translateY(-20px);
            opacity: 0;
        }

        .env-pretitle {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.6rem, 2.3vw, 0.72rem);
            letter-spacing: 5px;
            color: var(--champagne-gold);
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* Solid Metallic Gold Styling (Guaranteed to render on all mobile browsers) */
        .gold-foil-names {
            font-family: 'Chalisa Oktavia', 'Pinyon Script', cursive;
            font-size: clamp(2.6rem, 10.5vw, 4rem);
            line-height: 1.25;
            margin: 0;
            color: #E5C158;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 18px rgba(212, 175, 55, 0.35);
            font-weight: 400;
            padding: 6px 10px;
            display: block;
        }

        .env-ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.3rem, 4.5vw, 1.7rem);
            color: var(--kasavu-gold);
            margin: 2px 0;
            letter-spacing: 2px;
        }

        /* 3D Luxury Gold Wax Seal */
        .wax-seal-wrapper {
            margin: 26px auto 12px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wax-seal {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #F5D77F 0%, #D4AF37 45%, #8A640F 85%, #5A3E04 100%);
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.9),
                inset 0 2px 5px rgba(255,255,255,0.6),
                inset 0 -4px 8px rgba(0,0,0,0.6),
                0 0 20px rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: sealPulse 2.5s infinite ease-in-out;
            border: 1.5px solid rgba(252, 246, 186, 0.5);
        }

        .wax-seal::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border-radius: 50%;
            border: 1px dashed rgba(90, 62, 4, 0.6);
        }

        .seal-monogram {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #4A3200;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .tap-prompt {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: var(--champagne-gold);
            text-transform: uppercase;
            margin-top: 16px;
            animation: fadeBlink 2s infinite alternate;
        }

        @keyframes sealPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes fadeBlink {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 
         * 2. AMBIENT GOLD DUST CANVAS
         */
        #gold-dust-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 3;
        }

        /* 
         * 3. AESTHETIC FULL-SCREEN VERTICAL REEL
         */
        .reel-container {
            height: 100vh;
            height: 100dvh; 
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            position: relative;
            -webkit-overflow-scrolling: touch; 
        }

        .slide {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 
         * FULL RESOLUTION BACKGROUND STACK (With PhotoA-D Fallbacks)
         */
        .slide-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        .bg-slide-1 { background-image: url('3ae5e1fd0759a9d37f9ea03ef4c1c755.jpg'), url('PhotoA.jpg'); }
        .bg-slide-2 { background-image: url('b3219ac4a5758c971474439a28830d00.jpg'), url('PhotoB.jpg'); }
        .bg-slide-3 { background-image: url('7f00c9acee3ca2a463cbbe19b6335510.jpg'), url('PhotoC.jpg'); }
        .bg-slide-4 { background-image: url('623db16133a6758f32539fd6d8303f46.jpg'), url('PhotoD.jpg'); }

        /* 
         * HORIZONTAL CAROUSEL FOR COUPLE PHOTOS
         */
        .horizontal-carousel {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            z-index: 1;
            scrollbar-width: none;
        }
        
        .horizontal-carousel::-webkit-scrollbar {
            display: none;
        }

        .carousel-item {
            min-width: 100vw;
            height: 100%;
            scroll-snap-align: center;
            position: relative;
            overflow: hidden;
        }

        .carousel-bg {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.3);
            z-index: 0;
        }

        .carousel-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain; 
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
        }

        /* 
         * EDITORIAL DARKENING OVERLAY
         */
        .slide-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5,10,7,0.4) 0%, rgba(5,10,7,0.92) 100%);
            z-index: 2;
        }

        /* 
         * TRANSPARENT EDITORIAL LAYOUT
         */
        .editorial-wrapper {
            background: transparent;
            padding: 20px;
            width: 90%;
            max-width: 460px;
            position: relative;
            z-index: 4;
            text-align: center;
        }

        /*Visible by default so screen is never blank even if JS observer is delayed */
        .animate-item {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.9s ease-out, transform 0.9s ease-out;
        }

        .christian-cross {
            width: 1.5px;
            height: 42px;
            background: var(--kasavu-gold);
            margin: 0 auto 20px auto;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .christian-cross::after {
            content: '';
            position: absolute;
            top: 14px;
            left: -11px;
            width: 23px;
            height: 1.5px;
            background: var(--kasavu-gold);
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .vertical-line {
            width: 1.5px;
            height: 45px;
            background: linear-gradient(to bottom, transparent, var(--kasavu-gold), transparent);
            margin: 0 auto 16px auto;
        }
        
        .horizontal-line {
            width: 60px;
            height: 1.5px;
            background: var(--kasavu-gold);
            margin: 20px auto;
            opacity: 0.7;
        }

        /* 
         * REFINED TYPOGRAPHY
         */
        .names-script {
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(2.8rem, 11vw, 4.3rem); 
            color: var(--pure-white);
            line-height: 1.08;
            margin: 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 2px 5px rgba(0,0,0,0.8);
            font-weight: 400;
        }

        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            color: var(--kasavu-gold);
            font-style: italic;
            margin: 6px 0;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .details {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            letter-spacing: 3px;
            color: rgba(253, 251, 247, 0.95);
            text-transform: uppercase;
            font-weight: 400;
            line-height: 1.8;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .theme-note {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
            text-transform: none;
            margin-top: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .event-heading {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 6vw, 2.1rem);
            color: var(--kasavu-gold);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
            text-shadow: 0 3px 15px rgba(0,0,0,0.9);
        }

        .date-highlight {
            color: var(--pure-white); 
            font-weight: 500;
            font-size: clamp(1.1rem, 4.5vw, 1.35rem);
            display: block;
            margin: 10px 0 5px 0;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }

        .time-highlight {
            font-size: clamp(0.75rem, 3vw, 0.88rem);
            letter-spacing: 2.5px;
            color: rgba(253, 251, 247, 0.9);
            text-transform: uppercase;
            display: block;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .venue-bold {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--kasavu-gold);
            font-size: clamp(0.95rem, 3.5vw, 1.15rem);
            display: block;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* 
         * INTERACTIVE ACTION PILL BUTTONS (MAP & CALENDAR)
         */
        .action-btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0 10px 0;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(212, 175, 55, 0.45);
            border-radius: 30px;
            color: var(--pure-white);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .map-icon {
            width: 13px;
            height: 13px;
            fill: var(--kasavu-gold);
        }

        /* 
         * LIVE EDITORIAL COUNTDOWN TIMER
         */
        .countdown-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 18px auto;
        }

        .countdown-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 52px;
        }

        .countdown-num {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.3rem, 5vw, 1.75rem);
            color: var(--kasavu-gold);
            font-weight: 500;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .countdown-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .countdown-sep {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: rgba(212, 175, 55, 0.4);
            margin-top: -12px;
        }

        .swipe-indicator {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            z-index: 10;
            animation: swipePulse 2s infinite;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            pointer-events: none; 
        }

        .swipe-indicator::after {
            content: '';
            display: block;
            width: 1px;
            height: 18px;
            background: rgba(255,255,255,0.6);
            margin: 6px auto 0 auto;
        }

        @keyframes swipePulse {
            0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-5px); }
        }

        /* 
         * RSVP MODAL & BUTTON
         */
        .rsvp-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 13px 40px;
            background: transparent;
            border: 1px solid var(--kasavu-gold);
            color: var(--kasavu-gold);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.78rem;
            font-family: 'Cinzel', serif;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 2000; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1; pointer-events: all;
        }

        .modal-content {
            background: rgba(10, 15, 12, 0.95);
            border: 1px solid var(--kasavu-gold);
            padding: 40px 30px;
            width: 85%; max-width: 380px;
            border-radius: 4px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .close-modal {
            position: absolute; top: 10px; right: 20px;
            color: var(--kasavu-gold); font-size: 28px; cursor: pointer;
            font-family: 'Montserrat', sans-serif; font-weight: 300;
        }

        .form-input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            background: transparent; border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--pure-white); font-family: 'Montserrat', sans-serif;
            border-radius: 2px; text-align: center;
            letter-spacing: 2px;
        }
        .form-input::placeholder { color: rgba(255,255,255,0.4); }
        .form-input:focus { outline: none; border-color: var(--kasavu-gold); }

        .rsvp-thank-you {
            display: none;
            padding: 15px 0;
        }

        /* 
         * MUSIC PILL BUTTON
         */
        .music-pill {
            position: fixed; top: 25px; right: 25px;
            display: flex; align-items: center; gap: 8px;
            background: rgba(10, 15, 12, 0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(212, 175, 55, 0.45);
            padding: 10px 18px; border-radius: 30px; z-index: 100;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .music-pill.playing {
            border-color: var(--kasavu-gold);
            background: rgba(10, 15, 12, 0.9);
        }

        .music-text {
            color: var(--kasavu-gold);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem; letter-spacing: 2px;
            text-transform: uppercase; font-weight: 500;
        }

        .wave-container {
            display: flex; gap: 2px; height: 12px; align-items: center;
        }
        
        .wave-bar {
            width: 2px; height: 3px;
            background: var(--kasavu-gold); border-radius: 2px;
        }

        .music-pill.playing .wave-bar:nth-child(1) { animation: wave 1s infinite alternate ease-in-out; }
        .music-pill.playing .wave-bar:nth-child(2) { animation: wave 1.2s infinite alternate ease-in-out 0.2s; }
        .music-pill.playing .wave-bar:nth-child(3) { animation: wave 0.8s infinite alternate ease-in-out 0.4s; }

        @keyframes wave {
            0% { height: 3px; }
            100% { height: 12px; }
        }

        #yt-player-container {
            position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 1. BESPOKE LUXURY ENVELOPE ENTRY SCREEN -->
    <div id="envelope-screen" class="envelope-overlay" onclick="openInvitation()">
        <div class="envelope-border"></div>
        <div class="envelope-flap-top"></div>
        <div class="envelope-pocket-bottom"></div>

        <div class="envelope-content">
            <div class="christian-cross" style="height: 34px; margin-bottom: 18px;"></div>
            <div class="env-pretitle">The Wedding Celebration Of</div>
            
            <h1 class="gold-foil-names">Sana Sunny</h1>
            <div class="env-ampersand">&amp;</div>
            <h1 class="gold-foil-names">Hazel Joshy Thomas</h1>

            <div class="wax-seal-wrapper">
                <div class="wax-seal">
                    <span class="seal-monogram">S&amp;H</span>
                </div>
                <div class="tap-prompt">Tap Seal to Open</div>
            </div>
        </div>
    </div>

    <!-- 2. AMBIENT GOLD DUST PARTICLES CANVAS -->
    <canvas id="gold-dust-canvas"></canvas>

    <!-- YOUTUBE PLAYER CONTAINER -->
    <div id="yt-player-container">
        <div id="ytplayer"></div>
